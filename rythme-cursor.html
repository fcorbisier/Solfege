<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dictée de Rythme</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥁</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e12;--surface:#16161e;--surface2:#1e1e2a;--border:#2a2a3a;--accent:#c8a97e;--accent2:#7eb8c8;--text:#e8e4d9;--muted:#6b6880;--success:#7ec87e;--error:#c87e7e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem;
  background-image:radial-gradient(ellipse 70% 40% at 15% 5%,rgba(126,184,200,.06) 0%,transparent 60%)}
header{text-align:center;margin-bottom:1.2rem}
header h1{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:400;color:var(--accent)}
header p{color:var(--muted);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;margin-top:.3rem}
.back{position:absolute;top:1.2rem;left:1.2rem;font-size:.72rem;color:var(--muted);text-decoration:none;
  display:flex;align-items:center;gap:.3rem;transition:color .15s}
.back:hover{color:var(--accent)}
.layout{width:100%;max-width:1100px;display:grid;grid-template-columns:280px 1fr;gap:1.2rem;align-items:start}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.2rem}
.pt{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem}
.pt::after{content:'';flex:1;height:1px;background:var(--border)}
.col-left,.col-right{display:flex;flex-direction:column;gap:1.2rem}
label{display:block;font-size:.6rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.35rem}
select,input[type=range]{width:100%;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);font-family:'DM Mono',monospace;font-size:.82rem;padding:.4rem .65rem;
  border-radius:6px;outline:none}
select:focus{border-color:var(--accent)}
select option{background:var(--surface2)}
input[type=range]{padding:.2rem 0;accent-color:var(--accent)}
.rl{display:flex;justify-content:space-between;font-size:.6rem;color:var(--muted);margin-top:.2rem}
.cfg{display:flex;flex-direction:column;gap:.85rem}

/* Portée (VexFlow) */
.staff-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:.5rem .75rem;overflow-x:auto;position:relative;min-height:120px}
.staff{min-height:100px;position:relative;z-index:1}
.staff svg{display:block;max-width:none}
.staff-hidden{display:flex;align-items:center;justify-content:center;min-height:100px;opacity:.35}
.staff-hidden svg{width:100%;max-width:520px;height:90px}
.play-cursor{position:absolute;top:8px;bottom:8px;width:2px;background:var(--accent);
  opacity:0;pointer-events:none;z-index:2;box-shadow:0 0 6px var(--accent)}
.play-cursor.on{opacity:.85}
.fig-icon{display:flex;align-items:center;justify-content:center;line-height:0}
.fig-icon svg{overflow:visible}
.hint-txt{color:var(--muted);font-size:.75rem;font-style:italic;padding:.5rem}

/* Figures réponse */
.fig-kbd{display:flex;gap:.3rem;flex-wrap:wrap}
.fkb{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.3rem .4rem;
  border-radius:7px;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;
  transition:all .12s;min-width:38px;font-size:.48rem;color:var(--muted)}
.fkb:hover{border-color:var(--accent);color:var(--accent)}
.ans-display{display:flex;gap:.3rem;flex-wrap:wrap;min-height:44px;padding:.5rem;
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;align-items:center}
.achip{display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.2rem .3rem;
  border-radius:5px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.achip.ok{border-color:var(--success);background:rgba(126,200,126,.1)}
.achip.ko{border-color:var(--error);background:rgba(200,126,126,.1)}
.achip .albl{font-size:.44rem;color:var(--muted)}
.hint{font-size:.75rem;color:var(--muted);font-style:italic}

/* Boutons */
.btn{padding:.52rem .95rem;border-radius:8px;border:1px solid var(--border);background:var(--surface2);
  color:var(--text);font-family:'DM Mono',monospace;font-size:.75rem;cursor:pointer;transition:all .14s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:500}
.btn-p:hover{background:#d4b88e;color:var(--bg)}
.btn-sm{padding:.38rem .75rem;font-size:.7rem}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.controls{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem}
.tip{font-size:.62rem;color:var(--muted);margin-top:.6rem}
.result{padding:.6rem .9rem;border-radius:8px;font-size:.8rem;min-height:2rem;margin-top:.5rem}
.result.ok{background:rgba(126,200,126,.1);border:1px solid var(--success);color:var(--success)}
.result.ko{background:rgba(200,126,126,.1);border:1px solid var(--error);color:var(--error)}

@keyframes pulse{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.8)}}
.play-ind{display:none;align-items:center;gap:3px;margin-left:.5rem}
.play-ind.on{display:flex}
.ba{width:3px;height:10px;border-radius:2px;background:var(--accent);animation:pulse .55s ease-in-out infinite}
.ba:nth-child(2){animation-delay:.13s}.ba:nth-child(3){animation-delay:.26s}

#loading{position:fixed;inset:0;background:rgba(14,14,18,.95);display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:1rem;z-index:999}
#loading p{color:var(--accent);font-size:.85rem;letter-spacing:.1em}
.load-bar-wrap{width:240px;height:3px;background:#2a2a3a;border-radius:2px;overflow:hidden}
.load-bar{height:100%;width:0%;background:var(--accent);transition:width .3s}

@media(max-width:768px){
  .layout{grid-template-columns:1fr}
  .col-right{order:-1}.col-left{order:1}
}

/* ── Thème clair ──────────────────────────────────────────────────────── */
body.light{
  --bg:#f5f2ed;--surface:#ffffff;--surface2:#ede8e0;--border:#cec6b8;
  --accent:#8b5e2a;--text:#1a1510;--muted:#6a5f53;--success:#2d7a2d;--error:#a02020;
}
body.light{background-image:none!important;background-color:var(--bg)!important}
body.light .panel{box-shadow:0 2px 8px rgba(0,0,0,.07)}
body.light select,body.light input[type=text],body.light input[type=range],
body.light textarea{background:#fff!important;border-color:#cec6b8!important;color:var(--text)!important}
body.light .btn{background:#fff!important;border-color:#cec6b8!important;color:var(--text)!important}
body.light .btn-p{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}
body.light .kb,.light .note-btn,.light .fkb,.light .dur-btn{background:#fff!important;border-color:#cec6b8!important}
body.light .staff-wrap,.light .staff-container{background:#fff!important;border-color:#cec6b8!important}
/* ── Toggle thème ──────────────────────────────────────────────────────── */
#theme-btn{
  position:fixed;top:.8rem;right:.8rem;z-index:200;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:.35rem .65rem;cursor:pointer;font-size:1.1rem;transition:all .2s;
  line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.15);
}
#theme-btn:hover{border-color:var(--accent);transform:scale(1.05)}

/* ── Toggles figures en mode clair ───────────────────────────────────── */
body.light [data-checked="1"],
body.light .ftog input:checked+label{
  background:#8b5e2a!important;
  color:#fff!important;
  border-color:#8b5e2a!important;
}
body.light [data-checked="0"],
body.light .ftog label{
  background:#fff!important;
  color:#7a6e62!important;
  border-color:#cec6b8!important;
}
body.light .fkb{background:#fff!important;border-color:#cec6b8!important;color:#1a1510!important}

/* ── Smartphone ──────────────────────────────────────────────────────── */
@media(max-width:600px){
  body{padding:1rem .6rem}
  header h1{font-size:1.4rem}
  .layout{gap:.75rem}
  .panel{padding:.9rem .75rem}
  .staff-wrap{padding:.4rem;overflow-x:auto;-webkit-overflow-scrolling:touch}
  #staff-vex-host svg{height:130px!important}
  /* Clavier de réponse — touches plus grandes */
  .kb{padding:.7rem 1rem!important;font-size:1rem!important;min-width:44px;min-height:44px}
  .note-btn{padding:.7rem 1rem!important;font-size:1rem!important;min-width:44px;min-height:44px}
  /* Boutons contrôle */
  .btn{padding:.6rem .9rem;font-size:.8rem}
  .btn-sm{padding:.5rem .8rem;font-size:.75rem}
  /* Réponse */
  .ans-notes{min-height:52px}
  .an{font-size:1rem!important;padding:.4rem .8rem!important}
  /* Config col */
  .cfg{gap:.65rem}
  select,input[type=text]{font-size:.9rem;padding:.5rem .7rem}
  /* Score */
  #sc-ok,#sc-t,#sc-p{font-size:1.8rem!important}
  /* Tip raccourcis — caché sur mobile */
  .tip{display:none}
  /* Bouton thème */
  #theme-btn{top:.5rem;right:.5rem;padding:.3rem .55rem;font-size:1rem}
  /* Lien retour */
  .back{top:.5rem;left:.5rem}
  /* Sélecteur notes actives */
  .notes-sel{gap:.25rem}
  .nt label{width:40px!important;height:40px!important;font-size:.85rem!important}
}
</style>
</head>
<body>

<button id="theme-btn" title="Thème clair/sombre">☀️</button>

<a href="index.html" class="back">← Accueil</a>

<div id="loading">
  <div style="font-size:2.5rem">🎹</div>
  <p id="load-msg">Chargement du piano…</p>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
</div>

<header>
  <h1>Dictée de Rythme</h1>
  <p>Piano Steinway · <span style="color:var(--border)">v1.0</span></p>
</header>

<div class="layout">
<div class="col-left">

  <div class="panel">
    <div class="pt">Configuration</div>
    <div class="cfg">
      <div>
        <label>Mesure</label>
        <select id="meter">
          <option value="2">2/4</option>
          <option value="4" selected>4/4</option>
          <option value="3">3/4</option>
        </select>
      </div>
      <div>
        <label>Nombre de mesures</label>
        <select id="bars">
          <option value="1">1 mesure</option>
          <option value="2" selected>2 mesures</option>
          <option value="3">3 mesures</option>
          <option value="4">4 mesures</option>
        </select>
      </div>
      <div>
        <label>Tempo — <span id="tv">80</span> BPM</label>
        <input type="range" id="tempo" min="40" max="160" value="80" oninput="document.getElementById('tv').textContent=this.value">
      </div>
      <div>
        <label>Son</label>
        <select id="sound-type" onchange="onSoundTypeChange()">
          <option value="piano">🎹 Piano</option>
          <option value="snare">🥁 Caisse claire</option>
        </select>
      </div>
      <div id="piano-note-row">
        <label>Note piano</label>
        <select id="piano-note">
          <option value="do">Do</option><option value="ré">Ré</option>
          <option value="mi">Mi</option><option value="fa">Fa</option>
          <option value="sol" selected>Sol</option><option value="la">La</option><option value="si">Si</option>
        </select>
      </div>
      <div>
        <label>Figures actives</label>
        <div id="fig-toggles" style="display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.4rem"></div>
      </div>
    </div>
  </div>

  <!-- Score -->
  <div class="panel">
    <div class="pt">Score</div>
    <div style="display:flex;justify-content:space-around;text-align:center">
      <div><div style="font-size:1.6rem;font-family:'Playfair Display',serif" id="sc-ok">0</div><div style="font-size:.62rem;color:var(--muted)">Réussis</div></div>
      <div><div style="font-size:1.6rem;font-family:'Playfair Display',serif" id="sc-t">0</div><div style="font-size:.62rem;color:var(--muted)">Total</div></div>
      <div><div style="font-size:1.6rem;font-family:'Playfair Display',serif" id="sc-p">—</div><div style="font-size:.62rem;color:var(--muted)">Précision</div></div>
    </div>
    <div id="dots" style="display:flex;gap:3px;flex-wrap:wrap;margin-top:.75rem"></div>
    <button class="btn btn-sm" style="margin-top:.75rem;color:var(--muted)" onclick="resetScore()">Réinitialiser</button>
    <button class="btn btn-sm" style="margin-top:.5rem;color:var(--muted)" onclick="resetConfig()">↺ Config par défaut</button>
  </div>

</div><!-- /col-left -->
<div class="col-right">

  <!-- Portée -->
  <div class="panel">
    <div class="pt">
      Mesure à identifier
      <div class="play-ind" id="play-ind"><div class="ba"></div><div class="ba"></div><div class="ba"></div></div>
    </div>
    <div class="staff-wrap">
      <div id="play-cursor" class="play-cursor"></div>
      <div class="staff" id="staff"><span class="hint-txt">Générez un rythme</span></div>
    </div>
    <div class="controls">
      <button class="btn btn-p" id="btn-gen" onclick="generate()">⟳ Générer</button>
      <button class="btn" id="btn-play" onclick="playRhythm()" disabled>▶ Écouter</button>
      <button class="btn" id="btn-reveal" onclick="revealAll()" disabled>◎ Révéler</button>
    </div>
    <!-- Option métronome -->
    <div style="display:flex;align-items:center;gap:.6rem;margin-top:.6rem">
      <label style="position:relative;display:inline-block;width:36px;height:20px;cursor:pointer;flex-shrink:0">
        <input type="checkbox" id="metro-on" checked style="opacity:0;width:0;height:0">
        <span id="metro-slider" style="position:absolute;inset:0;background:var(--accent);border-radius:20px;transition:.2s"></span>
        <span id="metro-knob" style="position:absolute;height:14px;width:14px;left:19px;bottom:3px;background:var(--bg);border-radius:50%;transition:.2s"></span>
      </label>
      <span style="font-size:.65rem;color:var(--muted)">Métronome pendant la lecture</span>
    </div>
    <div class="tip">[Espace] Rejouer · [Entrée] Vérifier</div>
  </div>

  <!-- Réponse -->
  <div class="panel">
    <div class="pt">Votre réponse</div>
    <div class="ans-display" id="ans-display"><span class="hint">Cliquez sur les figures ci-dessous</span></div>
    <div class="fig-kbd" id="fig-kbd" style="margin-top:.75rem"></div>
    <div style="display:flex;gap:.5rem;margin-top:.75rem">
      <button class="btn btn-p btn-sm" onclick="check()">✓ Vérifier</button>
      <button class="btn btn-sm" onclick="testAns()">▶ Tester</button>
      <button class="btn btn-sm" onclick="undoAns()">↩ Annuler</button>
      <button class="btn btn-sm" onclick="clearAns()">✗ Effacer</button>
    </div>
    <div class="result" id="result"></div>
  </div>

</div><!-- /col-right -->
</div><!-- /layout -->

<script>
// ═══ FIGURES ═══════════════════════════════
const GROUPS=[
  {id:'ronde',    beats:4,   cat:'n', label:'Ronde',      W:52},
  {id:'blanche',  beats:2,   cat:'n', label:'Blanche',    W:46},
  {id:'noire',    beats:1,   cat:'n', label:'Noire',      W:40},
  {id:'croche',   beats:.5,  cat:'n', label:'Croche',     W:38},
  {id:'2croches', beats:1,   cat:'g', label:'2 croches',  W:52},
  {id:'4dcroches',beats:1,   cat:'g', label:'4 d.croches',W:72},
  {id:'croche-2dcr',beats:1, cat:'g', label:'♪𝅘𝅥𝅯𝅘𝅥𝅯',    W:58},
  {id:'contretemps',beats:1, cat:'g', label:'Contretemps',W:52},
  {id:'s-ronde',  beats:4,   cat:'s', label:'Pause',      W:46},
  {id:'s-blanche',beats:2,   cat:'s', label:'½-pause',    W:40},
  {id:'s-noire',  beats:1,   cat:'s', label:'Soupir',     W:36},
  {id:'s-croche', beats:.5,  cat:'s', label:'½-soupir',   W:34},
  {id:'noire-pt', beats:1.5, cat:'n', label:'Noire pt.',  W:48},
  {id:'blanche-pt',beats:3,  cat:'n', label:'Blanche pt.',W:54},
];
const DEFAULT_ON=new Set(['noire','2croches','contretemps','s-noire']);
function G(id){return GROUPS.find(g=>g.id===id);}

// ═══ VEXFLOW — gravure musicale ═══════════════
let vexReady=false;
const RHYTHM_KEY='g/5/x2'; // tête ronde sur ligne (rythme / percussion)

function loadVexFlow(){
  return new Promise((resolve,reject)=>{
    if(window.Vex?.Flow){vexReady=true;resolve();return;}
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow.js';
    s.onload=()=>{vexReady=true;resolve();};
    s.onerror=reject;
    document.head.appendChild(s);
  });
}

function cssVar(name,fallback){
  const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v||fallback;
}

function voiceTimeForBeats(beats){
  if(Math.abs(beats-.5)<.001)return{num_beats:1,beat_value:8};
  if(Math.abs(beats-1)<.001)return{num_beats:1,beat_value:4};
  if(Math.abs(beats-1.5)<.001)return{num_beats:3,beat_value:8};
  if(Math.abs(beats-2)<.001)return{num_beats:2,beat_value:4};
  if(Math.abs(beats-3)<.001)return{num_beats:3,beat_value:4};
  if(Math.abs(beats-4)<.001)return{num_beats:4,beat_value:4};
  return{num_beats:Math.max(1,Math.round(beats*4)),beat_value:4};
}

function pushFigureTickables(VF,id,notes,beams){
  const{StaveNote}=VF;
  const stem={stem_direction:VF.Stem?.UP??1};
  const k=[RHYTHM_KEY];
  switch(id){
    case 'ronde': notes.push(new StaveNote({keys:k,duration:'w',...stem})); break;
    case 'blanche': notes.push(new StaveNote({keys:k,duration:'h',...stem})); break;
    case 'noire': notes.push(new StaveNote({keys:k,duration:'q',...stem})); break;
    case 'croche': notes.push(new StaveNote({keys:k,duration:'8',...stem})); break;
    case 'noire-pt': notes.push(new StaveNote({keys:k,duration:'q.',...stem})); break;
    case 'blanche-pt': notes.push(new StaveNote({keys:k,duration:'h.',...stem})); break;
    case 's-ronde': notes.push(new StaveNote({keys:k,duration:'wr'})); break;
    case 's-blanche': notes.push(new StaveNote({keys:k,duration:'hr'})); break;
    case 's-noire': notes.push(new StaveNote({keys:k,duration:'qr'})); break;
    case 's-croche': notes.push(new StaveNote({keys:k,duration:'8r'})); break;
    case '2croches':{
      const a=new StaveNote({keys:k,duration:'8',...stem});
      const b=new StaveNote({keys:k,duration:'8',...stem});
      notes.push(a,b);beams.push([a,b]);break;
    }
    case '4dcroches':{
      const ns=[0,1,2,3].map(()=>new StaveNote({keys:k,duration:'16',...stem}));
      notes.push(...ns);beams.push(ns);break;
    }
    case 'croche-2dcr':{
      const a=new StaveNote({keys:k,duration:'8',...stem});
      const b=new StaveNote({keys:k,duration:'16',...stem});
      const c=new StaveNote({keys:k,duration:'16',...stem});
      notes.push(a,b,c);beams.push([a,b,c]);break;
    }
    case 'contretemps':{
      notes.push(new StaveNote({keys:k,duration:'8r'}));
      notes.push(new StaveNote({keys:k,duration:'8',...stem}));
      break;
    }
    default: notes.push(new StaveNote({keys:k,duration:'q',...stem}));
  }
}

function drawTickablesOnStave(VF,ctx,stave,tickables,totalBeats,beams){
  const{Voice,Formatter,Beam}=VF;
  const voice=new Voice(voiceTimeForBeats(totalBeats));
  voice.setStrict(false);
  voice.addTickables(tickables);
  const fmtW=Math.max(40,stave.getWidth()-16);
  new Formatter().joinVoices([voice]).format([voice],fmtW);
  voice.setStave(stave).draw(ctx,stave);
  beams.forEach(group=>{
    if(group.length>=2)new Beam(group).setContext(ctx).draw();
  });
}

function splitIntoMeasures(seq,meter){
  const measures=[];let cur=[];let beats=0;
  seq.forEach(id=>{
    const g=G(id);if(!g)return;
    cur.push(id);beats+=g.beats;
    if(Math.abs(beats-meter)<.001){measures.push(cur);cur=[];beats=0;}
  });
  if(cur.length)measures.push(cur);
  return measures;
}

function renderVexFigure(container,id,W,H,col){
  if(!vexReady||!window.Vex?.Flow){container.textContent='…';return;}
  const VF=Vex.Flow;
  container.innerHTML='';
  const notes=[];const beams=[];
  pushFigureTickables(VF,id,notes,beams);
  const beats=G(id)?.beats||1;
  const renderer=new VF.Renderer(container,VF.Renderer.Backends.SVG);
  renderer.resize(W,H);
  const ctx=renderer.getContext();
  ctx.setStrokeStyle(col);ctx.setFillStyle(col);
  const stave=new VF.Stave(4,8,Math.max(W-8,32));
  stave.setContext(ctx).draw();
  drawTickablesOnStave(VF,ctx,stave,notes,beats,beams);
}

function svgFig(id,col,W,H){

function renderRhythmScore(container,seq){

  container.innerHTML='';
  const renderer=new VF.Renderer(container,VF.Renderer.Backends.SVG);
  renderer.resize(width,height);
  const ctx=renderer.getContext();
  const col=cssVar('--text','#e8e4d9');
  ctx.setStrokeStyle(col);ctx.setFillStyle(col);
  let x=12;
  const y=18;
  measures.forEach((measureIds,mi)=>{
    const notes=[];const beams=[];
    measureIds.forEach(fid=>pushFigureTickables(VF,fid,notes,beams));
    const stave=new VF.Stave(x,y,staveW);
    if(mi===0)stave.addClef('percussion').addTimeSignature(`${meter}/4`);
    else stave.setBegBarType(VF.Barline.type.SINGLE);

    stave.setContext(ctx).draw();
    drawTickablesOnStave(VF,ctx,stave,notes,meter,beams);
    x+=staveW;
  });
}

let _ttsVoice=null;
function _initVoice(){
  const v=speechSynthesis.getVoices();
  _ttsVoice=v.find(x=>x.lang.startsWith('fr')&&x.localService)||v.find(x=>x.lang.startsWith('fr'))||null;
}

function playPercussion(tAbs, type){
  if(!ready||!Tone)return;
  const ac=Tone.getContext().rawContext;
  const t=tAbs??ac.currentTime+.01;

  if(type==='wood'){
    const osc=ac.createOscillator(),gain=ac.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(800,t);
    osc.frequency.exponentialRampToValueAtTime(400,t+.06);
    gain.gain.setValueAtTime(.7,t);gain.gain.exponentialRampToValueAtTime(.001,t+.08);
    osc.connect(gain);gain.connect(ac.destination);osc.start(t);osc.stop(t+.1);

  } else if(type==='snare'){
    const bufLen=ac.sampleRate*.15,buf=ac.createBuffer(1,bufLen,ac.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufLen;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/bufLen,2);
    const noise=ac.createBufferSource();noise.buffer=buf;
    const filter=ac.createBiquadFilter();filter.type='bandpass';filter.frequency.value=3000;filter.Q.value=0.7;
    const ng=ac.createGain();ng.gain.setValueAtTime(.6,t);ng.gain.exponentialRampToValueAtTime(.001,t+.18);
    noise.connect(filter);filter.connect(ng);ng.connect(ac.destination);noise.start(t);noise.stop(t+.2);
    const osc=ac.createOscillator(),tg=ac.createGain();
    osc.type='triangle';osc.frequency.value=180;
    tg.gain.setValueAtTime(.5,t);tg.gain.exponentialRampToValueAtTime(.001,t+.08);
    osc.connect(tg);tg.connect(ac.destination);osc.start(t);osc.stop(t+.1);

  } else if(type==='click'){
    const osc=ac.createOscillator(),gain=ac.createGain();
    osc.type='sine';osc.frequency.value=1000;
    gain.gain.setValueAtTime(.5,t);gain.gain.exponentialRampToValueAtTime(.001,t+.025);
    osc.connect(gain);gain.connect(ac.destination);osc.start(t);osc.stop(t+.03);

  } else if(type==='voice'){
    const delayMs=(t-ac.currentTime)*1000;
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance('ta');
      u.lang='fr-FR';u.rate=2.5;u.pitch=1.2;u.volume=1;
      if(_ttsVoice)u.voice=_ttsVoice;
      speechSynthesis.speak(u);
    },Math.max(0,delayMs));
  }
}

async function loadTone(){
  if(Tone)return;
  if(window.Tone){Tone=window.Tone;return;}
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js';
    s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
  Tone=window.Tone;
  // Réutiliser l'AudioContext iOS créé dans le tap
}
async function ensureAudio(){
  // En mode clap/hihat, pas besoin du sampler Steinway
  if(getSoundType()!=='piano'){
    if(!Tone){await loadTone();try{await Tone.start();}catch(e){} if(Tone.getContext().rawContext.state==="suspended"){try{await Tone.getContext().rawContext.resume();}catch(e){}}}
    ready=true;return;
  }
  if(ready)return;
  document.getElementById('loading').style.display='flex';
  await loadTone();
  try{ await Tone.start(); }catch(e){}
  try{ const ac=Tone.getContext().rawContext; if(ac.state!=='running') await ac.resume(); }catch(e){}
  await new Promise(resolve=>{
    sampler=new Tone.Sampler({
      urls:{'A0':'A0.mp3','C1':'C1.mp3','D#1':'Ds1.mp3','F#1':'Fs1.mp3',
        'A1':'A1.mp3','C2':'C2.mp3','D#2':'Ds2.mp3','F#2':'Fs2.mp3',
        'A2':'A2.mp3','C3':'C3.mp3','D#3':'Ds3.mp3','F#3':'Fs3.mp3',
        'A3':'A3.mp3','C4':'C4.mp3','D#4':'Ds4.mp3','F#4':'Fs4.mp3',
        'A4':'A4.mp3','C5':'C5.mp3','D#5':'Ds5.mp3','F#5':'Fs5.mp3',
        'A5':'A5.mp3','C6':'C6.mp3'},
      baseUrl:'https://tonejs.github.io/audio/salamander/',release:1,
    }).toDestination();
    let pct=0;const iv=setInterval(()=>{pct=Math.min(pct+2,88);document.getElementById('load-bar').style.width=pct+'%';if(pct>=88)clearInterval(iv);},100);
    Tone.loaded().then(()=>{clearInterval(iv);document.getElementById('load-bar').style.width='100%';
      setTimeout(()=>{document.getElementById('loading').style.display='none';resolve();},400);
    }).catch(()=>{document.getElementById('loading').style.display='none';resolve();});
  });
  ready=true;
}

function getPianoMidi(){
  const n=document.getElementById('piano-note').value;
  return NOTE_MAP[n]?.[4]||'G4';
}
function getSoundType(){return document.getElementById('sound-type').value;}

function playGrp(grp, tAbs){
  const ac=Tone.getContext().rawContext;
  const beat=60/+document.getElementById('tempo').value;
  const soundType=getSoundType();
  const events={
    'ronde':[{o:0,d:3.5}],'blanche':[{o:0,d:1.7}],'noire':[{o:0,d:.85}],
    'croche':[{o:0,d:.4}],
    'blanche-pt':[{o:0,d:2.5}],'noire-pt':[{o:0,d:1.3}],
    '2croches':[{o:0,d:.4},{o:.5,d:.4}],
    '4dcroches':[{o:0,d:.2},{o:.25,d:.2},{o:.5,d:.2},{o:.75,d:.2}],
    'croche-2dcr':[{o:0,d:.4},{o:.5,d:.2},{o:.75,d:.2}],
    'contretemps':[{o:.5,d:.4}],
    's-ronde':[],'s-blanche':[],'s-noire':[],'s-croche':[],
  };
  (events[grp.id]||[]).forEach(ev=>{
    const tNote=tAbs+ev.o*beat;
    if(soundType==='piano'){
      if(!sampler||!sampler.loaded)return;
      const toneOffset=tNote-ac.currentTime;
      sampler.triggerAttackRelease(getPianoMidi(), Math.max(ev.d*beat,.18), Tone.now()+toneOffset);
    } else {
      playPercussion(tNote, soundType);
    }
  });
}

// clickT — utilise Tone.now() comme référence (même horloge que sampler)
function clickT(tTone, acc){
  // Convertir Tone.now() en ac.currentTime
  const ac=Tone.getContext().rawContext;
  const t=ac.currentTime+(tTone-Tone.now());
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.value=acc?1100:750;
  g.gain.setValueAtTime(acc?.4:.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.05);
}

// playGrpT — tTone est en Tone.now()
function playGrpT(grp, tTone){
  const beat=60/+document.getElementById('tempo').value;
  const soundType=getSoundType();
  const events={
    'ronde':[{o:0,d:3.5}],'blanche':[{o:0,d:1.7}],'noire':[{o:0,d:.85}],
    'croche':[{o:0,d:.4}],
    'blanche-pt':[{o:0,d:2.5}],'noire-pt':[{o:0,d:1.3}],
    '2croches':[{o:0,d:.4},{o:.5,d:.4}],
    '4dcroches':[{o:0,d:.2},{o:.25,d:.2},{o:.5,d:.2},{o:.75,d:.2}],
    'croche-2dcr':[{o:0,d:.4},{o:.5,d:.2},{o:.75,d:.2}],
    'contretemps':[{o:.5,d:.4}],
    's-ronde':[],'s-blanche':[],'s-noire':[],'s-croche':[],
  };
  (events[grp.id]||[]).forEach(ev=>{
    const tNote=tTone+ev.o*beat; // en Tone.now()
    if(soundType==='piano'){
      if(!sampler||!sampler.loaded)return;
      sampler.triggerAttackRelease(getPianoMidi(), Math.max(ev.d*beat,.18), tNote);
    } else {
      // Convertir en ac.currentTime pour playPercussion
      const ac=Tone.getContext().rawContext;
      playPercussion(ac.currentTime+(tNote-Tone.now()), soundType);
    }
  });
}

// ═══ GÉNÉRATION ════════════════════════════
function getMeter(){return parseInt(document.getElementById('meter').value)||4;}
function getBars(){return parseInt(document.getElementById('bars').value)||2;}

async function generate(){
  await ensureAudio();
  await resumeAudio();
  const meter=getMeter(), bars=getBars(), active=activeGroups();
  const target=meter*bars;
  if(!active.filter(g=>g.cat!=='s').length){alert('Activez au moins une figure non-silence.');return;}

  // Silences de remplissage disponibles (toujours présents même si non activés)
  const FILL_SILENCES=[
    {id:'s-blanche',beats:2},{id:'s-noire',beats:1},{id:'s-croche',beats:.5}
  ];

  const seq=[];let total=0;
  while(total<target-.001){
    const maxFit=target-total;
    const pool=active.filter(g=>g.beats<=maxFit+.001);
    if(!pool.length){
      // Aucune figure active ne rentre — compléter avec des silences
      const fillPool=FILL_SILENCES.filter(s=>s.beats<=maxFit+.001);
      if(!fillPool.length)break; // ne devrait pas arriver (s-croche=0.5)
      // Prendre le plus grand silence qui rentre
      const fill=fillPool.reduce((a,b)=>b.beats>a.beats?b:a);
      seq.push(fill.id);total+=fill.beats;
      continue;
    }
    const pick=pool[Math.floor(Math.random()*pool.length)];
    seq.push(pick.id);total+=pick.beats;
  }
  currentSeq=seq;revealed=false;userAns=[];
  renderStaff(true);renderAns(null);
  document.getElementById('result').className='result';
  document.getElementById('btn-play').disabled=false;
  document.getElementById('btn-reveal').disabled=false;
  setTimeout(playRhythm,300);
}

function movePlayCursor(beatIndex,totalBeats){
  const cursor=document.getElementById('play-cursor');
  const host=document.getElementById('staff-vex-host');
  if(!cursor||!host||!totalBeats)return;
  const svg=host.querySelector('svg');
  const leftPad=52;
  const w=(svg?.getBoundingClientRect().width)||host.offsetWidth||400;
  const ratio=Math.min(1,Math.max(0,beatIndex/totalBeats));
  cursor.style.left=(leftPad+ratio*(w-leftPad-12))+'px';
  cursor.classList.add('on');
}

// ═══ LECTURE ═══════════════════════════════
function playRhythm(){
  if(playing||!ready||!currentSeq.length)return;
  resumeAudio();
  const ac=Tone.getContext().rawContext;
  const beat=60/+document.getElementById('tempo').value;
  const meter=getMeter();
  playing=true;
  document.getElementById('play-ind').classList.add('on');
  document.getElementById('btn-play').disabled=true;

  const tNow=Tone.now();
  let t=tNow+.2;
  for(let i=0;i<meter;i++){clickT(t,i===0);t+=beat;}
  const seqStart=t;
  const total=currentSeq.reduce((s,id)=>s+(G(id)?.beats||0),0);

  if(document.getElementById('metro-on').checked){
    const totalBeats=currentSeq.reduce((s,id)=>s+(G(id)?.beats||0),0);
    for(let b=0;b<totalBeats;b++){
      clickT(seqStart+b*beat, b%meter===0);
    }
  }

  const totalBeats=total;
  let cursor=0;
  currentSeq.forEach((id,i)=>{
    const grp=G(id);
    const tNote=seqStart+cursor*beat;
    const beatAt=cursor;
    const delayMs=(tNote-tNow)*1000;
    setTimeout(()=>movePlayCursor(beatAt,totalBeats),delayMs);
    playGrpT(grp, tNote);
    cursor+=grp.beats;
  });

  setTimeout(()=>{
    hidePlayCursor();
    document.getElementById('play-ind').classList.remove('on');
    document.getElementById('btn-play').disabled=false;
    playing=false;
  },(seqStart+total*beat-tNow)*1000+400);
}

// ═══ RÉPONSE ═══════════════════════════════
function totalB(arr){return arr.reduce((s,id)=>s+(G(id)?.beats||0),0);}
function testAns(){
  if(!userAns.length||!ready)return;
  resumeAudio();
  const ac=Tone.getContext().rawContext;
  const beat=60/+document.getElementById('tempo').value;
  const t0=ac.currentTime+0.2;
  let cursor=0;
  userAns.forEach(id=>{
    const grp=G(id);if(!grp)return;
    playGrp(grp, t0+cursor*beat);
    cursor+=grp.beats;
  });
}
function addAns(id){
  const actual=currentSeq.length?totalB(currentSeq):getMeter()*getBars();
  if(totalB(userAns)+(G(id)?.beats||0)>actual+.001)return;
  userAns.push(id);renderAns(null);
  // Feedback audio
  if(ready){
    const ac=Tone.getContext().rawContext;
    playGrp(G(id),ac.currentTime+.01);
  }
}
function renderAns(results){
  const el=document.getElementById('ans-display');el.innerHTML='';
  if(!userAns.length){el.innerHTML='<span class="hint">Cliquez sur les figures</span>';return;}
  userAns.forEach((id,i)=>{
    const grp=G(id);if(!grp)return;
    const col=grp.cat==='s'?'var(--accent2)':'var(--text)';
    const chip=document.createElement('div');
    chip.className='achip'+(results?(results[i]?' ok':' ko'):'');
    chip.innerHTML=svgFig(id,col,38,44)+`<span class="albl">${grp.label}</span>`;
    chip.onclick=()=>{userAns.splice(i,1);renderAns(null);};
    el.appendChild(chip);
  });
}
function clearAns(){userAns=[];renderAns(null);document.getElementById('result').className='result';}
function undoAns(){userAns.pop();renderAns(null);}

function check(){
  if(!currentSeq.length)return;
  const actual=totalB(currentSeq); // total réellement généré
  if(Math.abs(totalB(userAns)-actual)>.001){
    showResult(false,`Total : ${totalB(userAns)} temps, ${actual} attendus.`);return;
  }
  const res=currentSeq.map((id,i)=>id===userAns[i]);
  const ok=res.every(Boolean)&&userAns.length===currentSeq.length;
  renderAns(res);revealAll();
  score.t++;if(ok){score.ok++;score.h.push('ok');}else score.h.push('ko');
  updateScore();
  ok?showResult(true,'✓ Parfait !'):showResult(false,`✗ C'était : ${currentSeq.map(id=>G(id)?.label).join(' · ')}`);
}
function showResult(ok,msg){const el=document.getElementById('result');el.className='result '+(ok?'ok':'ko');el.textContent=msg;}

function updateScore(){

    d.style.cssText=`width:8px;height:8px;border-radius:50%;background:${h==='ok'?'var(--success)':'var(--error)'}`;
    el.appendChild(d);

}

  metroKnob.style.background=metroChk.checked?'var(--bg)':'var(--muted)';
});

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&ready&&Tone){
    Tone.getContext().rawContext.resume().catch(()=>{});
  }
});
document.addEventListener('click',()=>{
  if(ready&&Tone){Tone.getContext().rawContext.resume().catch(()=>{});}
},{passive:true});

// Relancer explicitement avant chaque lecture
async function resumeAudio(){
  if(!ready||!Tone)return;
  const ac=Tone.getContext().rawContext;
  if(ac.state==='suspended'||ac.state==='interrupted'){
    try{await ac.resume();}catch(e){}
  }
}

setInterval(()=>{
  if(!ready||!Tone)return;
  const ac=Tone.getContext().rawContext;
  if(ac.state==='suspended'){ac.resume().catch(()=>{});return;}
  try{
    const osc=ac.createOscillator();
    const gain=ac.createGain();
    gain.gain.value=0;
    osc.connect(gain);gain.connect(ac.destination);
    osc.start();osc.stop(ac.currentTime+0.001);
  }catch(e){}
},25000);

// ── Thème clair/sombre ─────────────────────────────────────────────────
(function(){
  const KEY='solfege_theme';
  function applyTheme(t){
    document.body.classList.toggle('light',t==='light');
    const btn=document.getElementById('theme-btn');
    if(btn)btn.textContent=t==='light'?'🌙':'☀️';
  }
  function toggleTheme(){
    const t=document.body.classList.contains('light')?'dark':'light';
    localStorage.setItem(KEY,t);applyTheme(t);
    if(typeof currentSeq!=='undefined'&&currentSeq.length&&typeof renderStaff==='function'){
      renderStaff(!revealed);
      if(typeof buildFigKbd==='function')buildFigKbd();
    }
  }
  document.addEventListener('DOMContentLoaded',()=>{
    const saved=localStorage.getItem(KEY)||'dark';
    applyTheme(saved);
    const btn=document.getElementById('theme-btn');
    if(btn)btn.onclick=toggleTheme;
  });
})();

// ── Sauvegarde/restauration config ────────────────────────────────────
const CFG_KEY = 'solfege_config_rythme';
const CFG_DEFAULTS = {"meter": "4", "bars": "2", "tempo": "80", "sound-type": "piano", "piano-note": "sol"};

function saveConfig() {
  const cfg = {};
  const el_meter = document.getElementById('meter'); if(el_meter) cfg['meter'] = el_meter.value;
  const el_bars = document.getElementById('bars'); if(el_bars) cfg['bars'] = el_bars.value;
  const el_tempo = document.getElementById('tempo'); if(el_tempo) cfg['tempo'] = el_tempo.value;
  const el_sound_type = document.getElementById('sound-type'); if(el_sound_type) cfg['sound-type'] = el_sound_type.value;
  const el_piano_note = document.getElementById('piano-note'); if(el_piano_note) cfg['piano-note'] = el_piano_note.value;
  
  document.querySelectorAll('[id^="tog-"]').forEach(el => { cfg['tog_'+el.id.replace('tog-','')] = el.dataset.checked; });
  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch(e) {}
}

function loadConfig() {
  let cfg;
  try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch(e) {}
  cfg = cfg || CFG_DEFAULTS;
  if(cfg['meter'] !== undefined) { const el = document.getElementById('meter'); if(el) el.value = cfg['meter']; }
  if(cfg['bars'] !== undefined) { const el = document.getElementById('bars'); if(el) el.value = cfg['bars']; }
  if(cfg['tempo'] !== undefined) { const el = document.getElementById('tempo'); if(el) el.value = cfg['tempo']; }
  if(cfg['sound-type'] !== undefined) { const el = document.getElementById('sound-type'); if(el) el.value = cfg['sound-type']; }
  if(cfg['piano-note'] !== undefined) { const el = document.getElementById('piano-note'); if(el) el.value = cfg['piano-note']; }
  
  
  document.querySelectorAll('[id^="tog-"]').forEach(el => {
    const k = 'tog_'+el.id.replace('tog-','');
    if(cfg[k] !== undefined) {
      el.dataset.checked = cfg[k];
      el.style.borderColor = cfg[k]==='1' ? 'var(--accent)' : 'var(--border)';
      el.style.color = cfg[k]==='1' ? 'var(--accent)' : 'var(--muted)';
    }
  });
  const tvEl = document.getElementById('tv') || document.getElementById('tempo-val'); const tmEl = document.getElementById('tempo'); if(tvEl && tmEl) tvEl.textContent = tmEl.value;
  const bvEl = document.getElementById('bv'); const bsEl = document.getElementById('bars'); if(bvEl && bsEl) bvEl.textContent = bsEl.value;
  if(typeof onSoundTypeChange === 'function') onSoundTypeChange();
}

function resetConfig() {
  try { localStorage.removeItem(CFG_KEY); } catch(e) {}
  loadConfig();
}

// Auto-save sur tout changement dans la config
document.addEventListener('change', e => { saveConfig(); });
document.addEventListener('input', e => { if(e.target.type==='range') saveConfig(); });

</script>

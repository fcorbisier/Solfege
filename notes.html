<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dictée de Notes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
@font-face{
  font-family:'Bravura Text';
  src:url('https://cdn.jsdelivr.net/fontsource/fonts/bravura-text@latest/latin-400-normal.woff2') format('woff2');
  font-display:swap;
}
:root{--bg:#0e0e12;--surface:#16161e;--surface2:#1e1e2a;--border:#2a2a3a;--accent:#c8a97e;--text:#e8e4d9;--muted:#6b6880;--success:#7ec87e;--error:#c87e7e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem;
  background-image:radial-gradient(ellipse 70% 40% at 15% 5%,rgba(200,169,126,.06) 0%,transparent 60%)}
header{text-align:center;margin-bottom:1.2rem}
header h1{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:400;color:var(--accent)}
header p{color:var(--muted);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;margin-top:.3rem}
.back{position:absolute;top:1.2rem;left:1.2rem;font-size:.72rem;color:var(--muted);text-decoration:none;
  display:flex;align-items:center;gap:.3rem;transition:color .15s}
.back:hover{color:var(--accent)}
.layout{width:100%;max-width:1100px;display:grid;grid-template-columns:300px 1fr;gap:1.2rem;align-items:start}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.2rem}
.pt{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem}
.pt::after{content:'';flex:1;height:1px;background:var(--border)}
.col-left,.col-right{display:flex;flex-direction:column;gap:1.2rem}

/* Config */
label{display:block;font-size:.6rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.35rem}
select,input[type=range]{width:100%;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);font-family:'DM Mono',monospace;font-size:.82rem;padding:.4rem .65rem;
  border-radius:6px;outline:none;transition:border-color .2s}
select:focus{border-color:var(--accent)}
select option{background:var(--surface2)}
input[type=range]{padding:.2rem 0;accent-color:var(--accent)}
.rl{display:flex;justify-content:space-between;font-size:.6rem;color:var(--muted);margin-top:.2rem}
.cfg{display:flex;flex-direction:column;gap:.85rem}

/* Notes selector */
.notes-sel{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.5rem}
.nt input{display:none}
.nt label{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
  border-radius:8px;border:1.5px solid var(--border);cursor:pointer;font-size:.9rem;font-weight:500;
  transition:all .15s}
.nt input:checked+label{background:rgba(200,169,126,.12);border-color:currentColor}

/* Octave */
.ob-row{display:flex;gap:.4rem}
.ob{padding:.35rem .75rem;border-radius:6px;border:1px solid var(--border);background:var(--surface2);
  color:var(--muted);font-family:'DM Mono',monospace;font-size:.78rem;cursor:pointer;transition:all .12s}
.ob.sel{border-color:var(--accent);color:var(--accent);background:rgba(200,169,126,.08)}

/* Portée */
.staff-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.75rem;overflow-x:auto}
#staff-svg{display:block;min-width:300px}

/* Boutons */
.btn{padding:.52rem .95rem;border-radius:8px;border:1px solid var(--border);background:var(--surface2);
  color:var(--text);font-family:'DM Mono',monospace;font-size:.75rem;cursor:pointer;transition:all .14s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:500}
.btn-p:hover{background:#d4b88e;color:var(--bg)}
.btn-sm{padding:.38rem .75rem;font-size:.7rem}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.controls{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem}
.tip{font-size:.62rem;color:var(--muted);margin-top:.6rem}

/* Clavier réponse */
.kbd{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.kb{padding:.55rem .9rem;border-radius:7px;border:1px solid var(--border);background:var(--surface2);
  font-family:'DM Mono',monospace;font-size:.88rem;font-weight:500;cursor:pointer;transition:all .12s}
.kb:hover{transform:translateY(-2px)}
.kb:active{transform:scale(.95)}
.ans-notes{display:flex;gap:.4rem;flex-wrap:wrap;min-height:44px;padding:.5rem;
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;align-items:center}
.an{padding:.3rem .65rem;border-radius:5px;border:1px solid var(--border);font-size:.85rem;cursor:pointer}
.an.ok{border-color:var(--success);color:var(--success);background:rgba(126,200,126,.1)}
.an.ko{border-color:var(--error);color:var(--error);background:rgba(200,126,126,.1)}
.hint{font-size:.75rem;color:var(--muted);font-style:italic}
.result{padding:.6rem .9rem;border-radius:8px;font-size:.8rem;min-height:2rem;margin-top:.5rem}
.result.ok{background:rgba(126,200,126,.1);border:1px solid var(--success);color:var(--success)}
.result.ko{background:rgba(200,126,126,.1);border:1px solid var(--error);color:var(--error)}

/* Indicateur lecture */
@keyframes pulse{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.8)}}
.play-ind{display:none;align-items:center;gap:3px;margin-left:.5rem}
.play-ind.on{display:flex}
.ba{width:3px;height:10px;border-radius:2px;background:var(--accent);animation:pulse .55s ease-in-out infinite}
.ba:nth-child(2){animation-delay:.13s}.ba:nth-child(3){animation-delay:.26s}

/* Loading */
#loading{position:fixed;inset:0;background:rgba(14,14,18,.95);display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:1rem;z-index:999}
#loading p{color:var(--accent);font-size:.85rem;letter-spacing:.1em}
.load-bar-wrap{width:240px;height:3px;background:#2a2a3a;border-radius:2px;overflow:hidden}
.load-bar{height:100%;width:0%;background:var(--accent);transition:width .3s}

@media(max-width:768px){
  .layout{grid-template-columns:1fr}
  .col-right{order:-1}.col-left{order:1}
}

/* ── Thème clair ──────────────────────────────────────────────────────── */
body.light{
  --bg:#f5f2ed;--surface:#ffffff;--surface2:#ede8e0;--border:#cec6b8;
  --accent:#8b5e2a;--text:#1a1510;--muted:#6a5f53;--success:#2d7a2d;--error:#a02020;
}
body.light{background-image:none!important;background-color:var(--bg)!important}
body.light .panel{box-shadow:0 2px 8px rgba(0,0,0,.07)}
body.light select,body.light input[type=text],body.light input[type=range],
body.light textarea{background:#fff!important;border-color:#cec6b8!important;color:var(--text)!important}
body.light .btn{background:#fff!important;border-color:#cec6b8!important;color:var(--text)!important}
body.light .btn-p{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}
body.light .kb,.light .note-btn,.light .fkb,.light .dur-btn{background:#fff!important;border-color:#cec6b8!important}
body.light .staff-wrap,.light .staff-container{background:#fff!important;border-color:#cec6b8!important}
/* ── Toggle thème ──────────────────────────────────────────────────────── */
#theme-btn{
  position:fixed;top:.8rem;right:.8rem;z-index:200;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:.35rem .65rem;cursor:pointer;font-size:1.1rem;transition:all .2s;
  line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.15);
}
#theme-btn:hover{border-color:var(--accent);transform:scale(1.05)}

/* ── Smartphone ──────────────────────────────────────────────────────── */
@media(max-width:600px){
  body{padding:1rem .6rem}
  header h1{font-size:1.4rem}
  .layout{gap:.75rem}
  .panel{padding:.9rem .75rem}
  /* Portée SVG — plus grande sur mobile */
  .staff-wrap{padding:.4rem}
  #staff-svg{min-width:100%!important;height:150px!important}
  /* Noms des notes — agrandis via transform sur le SVG */
  .staff-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* Clavier de réponse — touches plus grandes */
  .kb{padding:.7rem 1rem!important;font-size:1rem!important;min-width:44px;min-height:44px}
  .note-btn{padding:.7rem 1rem!important;font-size:1rem!important;min-width:44px;min-height:44px}
  /* Boutons contrôle */
  .btn{padding:.6rem .9rem;font-size:.8rem}
  .btn-sm{padding:.5rem .8rem;font-size:.75rem}
  /* Réponse */
  .ans-notes{min-height:52px}
  .an{font-size:1rem!important;padding:.4rem .8rem!important}
  /* Config col */
  .cfg{gap:.65rem}
  select,input[type=text]{font-size:.9rem;padding:.5rem .7rem}
  /* Score */
  #sc-ok,#sc-t,#sc-p{font-size:1.8rem!important}
  /* Tip raccourcis — caché sur mobile */
  .tip{display:none}
  /* Bouton thème */
  #theme-btn{top:.5rem;right:.5rem;padding:.3rem .55rem;font-size:1rem}
  /* Lien retour */
  .back{top:.5rem;left:.5rem}
  /* Sélecteur notes actives */
  .notes-sel{gap:.25rem}
  .nt label{width:40px!important;height:40px!important;font-size:.85rem!important}
}
</style>
</head>
<body>

<button id="theme-btn" title="Thème clair/sombre">☀️</button>

<a href="index.html" class="back">← Accueil</a>

<div id="loading">
  <div style="font-size:2.5rem">🎹</div>
  <p id="load-msg">Chargement du piano…</p>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
</div>

<header>
  <h1>Dictée de Notes</h1>
  <p>Piano Steinway · <span style="color:var(--border)">v1.0</span></p>
</header>

<div class="layout">
<div class="col-left">

  <div class="panel">
    <div class="pt">Configuration</div>
    <div class="cfg">
      <div>
        <label>Mode</label>
        <select id="mode">
          <option value="random">Séquence aléatoire</option>
          <option value="melody">Mélodie rythmée</option>
          <option value="custom">Séquence personnalisée</option>
        </select>
      </div>
      <div id="custom-section" style="display:none">
        <label>Séquence (ex: do mi sol)</label>
        <input type="text" id="custom-seq" placeholder="do mi sol la"
          style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
          font-family:'DM Mono',monospace;font-size:.82rem;padding:.4rem .65rem;border-radius:6px;outline:none">
        <div style="font-size:.62rem;color:var(--muted);margin-top:.3rem">do ré(re) mi fa sol la si · séparés par des espaces</div>
      </div>
      <div id="random-options">
        <div>
          <label>Longueur — <span id="lv">4</span> notes</label>
          <input type="range" id="length" min="1" max="16" value="4" oninput="document.getElementById('lv').textContent=this.value">
        </div>
        <div style="margin-top:.85rem">
          <label>Notes actives</label>
          <div class="notes-sel">
            <div class="nt"><input type="checkbox" id="n-do" checked><label for="n-do" style="color:#e07070">Do</label></div>
            <div class="nt"><input type="checkbox" id="n-re" checked><label for="n-re" style="color:#e09550">Ré</label></div>
            <div class="nt"><input type="checkbox" id="n-mi" checked><label for="n-mi" style="color:#d4b840">Mi</label></div>
            <div class="nt"><input type="checkbox" id="n-fa" checked><label for="n-fa" style="color:#70b870">Fa</label></div>
            <div class="nt"><input type="checkbox" id="n-sol" checked><label for="n-sol" style="color:#5090d0">Sol</label></div>
            <div class="nt"><input type="checkbox" id="n-la" checked><label for="n-la" style="color:#8060c0">La</label></div>
            <div class="nt"><input type="checkbox" id="n-si" checked><label for="n-si" style="color:#c060a0">Si</label></div>
          </div>
        </div>
      </div>
      <div>
        <label>Tempo — <span id="tv">72</span> BPM</label>
        <input type="range" id="tempo" min="40" max="160" value="72" oninput="document.getElementById('tv').textContent=this.value">
      </div>
      <div>
        <label>Octave</label>
        <div class="ob-row">
          <button class="ob" data-oct="3" onclick="setOct(3)">3</button>
          <button class="ob sel" data-oct="4" onclick="setOct(4)">4</button>
          <button class="ob" data-oct="5" onclick="setOct(5)">5</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Score -->
  <div class="panel">
    <div class="pt">Score</div>
    <div style="display:flex;justify-content:space-around;text-align:center">
      <div><div style="font-size:1.6rem;font-family:'Playfair Display',serif" id="sc-ok" style="color:var(--success)">0</div><div style="font-size:.62rem;color:var(--muted)">Réussis</div></div>
      <div><div style="font-size:1.6rem;font-family:'Playfair Display',serif" id="sc-t">0</div><div style="font-size:.62rem;color:var(--muted)">Total</div></div>
      <div><div style="font-size:1.6rem;font-family:'Playfair Display',serif" id="sc-p">—</div><div style="font-size:.62rem;color:var(--muted)">Précision</div></div>
    </div>
    <div id="dots" style="display:flex;gap:3px;flex-wrap:wrap;margin-top:.75rem"></div>
    <button class="btn btn-sm" style="margin-top:.75rem;color:var(--muted)" onclick="resetScore()">Réinitialiser</button>
    <button class="btn btn-sm" style="margin-top:.5rem;color:var(--muted)" onclick="resetConfig()">↺ Config par défaut</button>
  </div>

</div><!-- /col-left -->
<div class="col-right">

  <!-- Portée -->
  <div class="panel">
    <div class="pt">
      Séquence
      <div class="play-ind" id="play-ind"><div class="ba"></div><div class="ba"></div><div class="ba"></div></div>
    </div>
    <div class="staff-wrap">
      <svg id="staff-svg" width="100%" height="120" viewBox="0 0 600 120" preserveAspectRatio="xMinYMid meet" style="min-width:300px">
        <defs>
          <filter id="note-blur"><feGaussianBlur stdDeviation="8"/></filter>
          <filter id="note-glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <g id="staff-lines"></g>
        <g id="staff-clef"></g>
        <g id="staff-notes"></g>
        <text id="staff-hint" x="300" y="65" text-anchor="middle" font-size="12"
          font-family="DM Mono,monospace" fill="var(--muted)" font-style="italic">Générez une séquence</text>
      </svg>
    </div>
    <div class="controls">
      <button class="btn btn-p" id="btn-gen" onclick="generate()">⟳ Générer</button>
      <button class="btn" id="btn-play" onclick="playSeq()" disabled>▶ Écouter</button>
      <button class="btn" id="btn-reveal" onclick="reveal()" disabled>◎ Révéler</button>
      <button class="btn btn-sm" id="btn-ref" onclick="playRef()" disabled>♩ Do</button>
    </div>
    <div class="tip">[Espace] Rejouer · [Entrée] Vérifier · [⌫] Annuler</div>
  </div>

  <!-- Réponse -->
  <div class="panel">
    <div class="pt">Votre réponse</div>
    <div class="ans-notes" id="ans-notes"><span class="hint">Cliquez sur les touches</span></div>
    <div class="kbd" id="kbd"></div>
    <div style="display:flex;gap:.5rem;margin-top:.75rem;flex-wrap:wrap">
      <button class="btn btn-p btn-sm" onclick="check()">✓ Vérifier</button>
      <button class="btn btn-sm" onclick="testAns()">▶ Tester</button>
      <button class="btn btn-sm" onclick="undoAns()">↩ Annuler</button>
      <button class="btn btn-sm" onclick="clearAns()">✗ Effacer</button>
    </div>
    <div class="result" id="result"></div>
  </div>

</div><!-- /col-right -->
</div><!-- /layout -->

<script>
// ═══ DURÉES POUR MODE MÉLODIE ══════════════
// notes:1 = figure simple (1 note), notes:2 = groupe de 2 notes, notes:4 = groupe de 4
const DURS = [
  {id:'blanche',   beats:2,   notes:1, sym:'𝅗𝅥', weight:1},
  {id:'noire',     beats:1,   notes:1, sym:'♩',  weight:4},
  {id:'noire-pt',  beats:1.5, notes:1, sym:'♩.', weight:1},
  {id:'croche',    beats:.5,  notes:1, sym:'♪',  weight:2},
  {id:'2croches',  beats:1,   notes:2, sym:'♪♪', weight:2},
  {id:'4dcr',      beats:1,   notes:4, sym:'𝅘𝅥𝅯𝅘𝅥𝅯𝅘𝅥𝅯𝅘𝅥𝅯',weight:1},
];

// Offsets et durées pour chaque note dans la figure
const DUR_EVENTS = {
  'blanche':   [{o:0,    dur:1.85}],                                              // 2 beats × 0.92
  'noire':     [{o:0,    dur:0.85}],                                              // 1 beat  × 0.85
  'noire-pt':  [{o:0,    dur:1.30}],                                              // 1.5 beats × 0.87
  'croche':    [{o:0,    dur:0.42}],                                              // 0.5 beat × 0.85
  '2croches':  [{o:0,    dur:0.42}, {o:.5,   dur:0.42}],                         // 2×croche
  '4dcr':      [{o:0,    dur:0.20}, {o:.25,  dur:0.20}, {o:.5, dur:0.20}, {o:.75, dur:0.20}], // 4×double
};

function randDur(){
  const total=DURS.reduce((s,d)=>s+d.weight,0);
  let r=Math.random()*total;
  for(const d of DURS){r-=d.weight;if(r<=0)return d;}
  return DURS[1];
}

// Génère la séquence de notes en tenant compte des figures multi-notes
// Retourne [{note, durId, noteIdx, offsetInGroup}]
function buildMelodySeq(active, len){
  const result=[];
  let remaining=len;
  while(remaining>0){
    const dur=randDur();
    const count=Math.min(dur.notes, remaining);
    // Si on ne peut pas remplir le groupe, on prend une figure simple
    const actualDur = count < dur.notes ? DURS.find(d=>d.notes===1&&d.beats<=.5)||DURS[3] : dur;
    const actualCount = actualDur.notes;
    for(let j=0;j<actualCount;j++){
      result.push({
        note: active[Math.floor(Math.random()*active.length)],
        durId: actualDur.id,
        noteIdx: j,
        groupSize: actualCount,
      });
    }
    remaining -= actualCount;
  }
  return result;
}

// ═══ DONNÉES ═══════════════════════════════
const NOTES=['do','ré','mi','fa','sol','la','si'];
const COLORS={do:'#e07070',ré:'#e09550',mi:'#d4b840',fa:'#70b870',sol:'#5090d0',la:'#8060c0',si:'#c060a0'};
const ALIASES={re:'ré',ré:'ré',do:'do',mi:'mi',fa:'fa',sol:'sol',la:'la',si:'si'};
const NOTE_MAP={do:{3:'C3',4:'C4',5:'C5'},ré:{3:'D3',4:'D4',5:'D5'},mi:{3:'E3',4:'E4',5:'E5'},
  fa:{3:'F3',4:'F4',5:'F5'},sol:{3:'G3',4:'G4',5:'G5'},la:{3:'A3',4:'A4',5:'A5'},si:{3:'B3',4:'B4',5:'B5'}};
const NY4={do:90,ré:84,mi:78,fa:72,sol:66,la:60,si:54};
const NY5={do:48,ré:42,mi:36,fa:30,sol:24};
const NY3={do:114,ré:108,mi:102,fa:96,sol:90,la:84,si:78};
function noteY(n,o){return o===5?(NY5[n]??36):o===3?(NY3[n]??90):(NY4[n]??66);}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

// ═══ STATE ═════════════════════════════════
let oct=4, seq=[], melodyDurs=[], ans=[], revealed=false, playing=false;
let score={t:0,ok:0,h:[]};
let sampler=null, ready=false, Tone=null;

// ═══ AUDIO ═════════════════════════════════
async function loadTone(){
  if(Tone)return;
  if(window.Tone){Tone=window.Tone;return;}
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js';
    s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
  Tone=window.Tone;
  // Réutiliser l'AudioContext iOS créé dans le tap
}
async function ensureAudio(){
  if(ready)return;
  document.getElementById('loading').style.display='flex';
  await loadTone();
  // Tone.start() a déjà été appelé dans le splash sur mobile
  // On s'assure juste que le contexte est actif
  try{ await Tone.start(); }catch(e){}
  try{
    const ac=Tone.getContext().rawContext;
    if(ac.state!=='running') await ac.resume();
  }catch(e){}
  await new Promise(resolve=>{
    sampler=new Tone.Sampler({
      urls:{'A0':'A0.mp3','C1':'C1.mp3','D#1':'Ds1.mp3','F#1':'Fs1.mp3',
        'A1':'A1.mp3','C2':'C2.mp3','D#2':'Ds2.mp3','F#2':'Fs2.mp3',
        'A2':'A2.mp3','C3':'C3.mp3','D#3':'Ds3.mp3','F#3':'Fs3.mp3',
        'A3':'A3.mp3','C4':'C4.mp3','D#4':'Ds4.mp3','F#4':'Fs4.mp3',
        'A4':'A4.mp3','C5':'C5.mp3','D#5':'Ds5.mp3','F#5':'Fs5.mp3',
        'A5':'A5.mp3','C6':'C6.mp3'},
      baseUrl:'https://tonejs.github.io/audio/salamander/',release:1,
    }).toDestination();
    let pct=0;const iv=setInterval(()=>{pct=Math.min(pct+2,88);document.getElementById('load-bar').style.width=pct+'%';if(pct>=88)clearInterval(iv);},100);
    Tone.loaded().then(()=>{clearInterval(iv);document.getElementById('load-bar').style.width='100%';
      setTimeout(()=>{document.getElementById('loading').style.display='none';resolve();},400);
    }).catch(()=>{document.getElementById('loading').style.display='none';resolve();});
  });
  ready=true;
}
function piano(note,o,dur){
  if(!sampler||!sampler.loaded)return;
  const m=NOTE_MAP[note]?.[o];if(!m)return;
  sampler.triggerAttackRelease(m,dur);
}

// ═══ PORTÉE SVG ════════════════════════════
function noteHeadSVG(x, y, col, durId, hidden){
  if(hidden){
    return `<g filter="url(#note-blur)" opacity=".18">
      <ellipse cx="${x}" cy="54" rx="7" ry="5" transform="rotate(-15,${x},54)" fill="var(--muted)"/>
      <line x1="${x+6}" y1="52" x2="${x+6}" y2="22" stroke="var(--muted)" stroke-width="1.5"/>
    </g>`;
  }
  const up=y>=54;
  let svg='';
  // Lignes supplémentaires
  if(y===90) svg+=`<line x1="${x-10}" y1="90" x2="${x+10}" y2="90" stroke="${col}" stroke-width="1.2" opacity=".7"/>`;
  if(y===48) svg+=`<line x1="${x-10}" y1="48" x2="${x+10}" y2="48" stroke="${col}" stroke-width="1.2" opacity=".7"/>`;

  // Tête
  const isOpen=durId==='blanche'||durId==='blanche-pt';
  if(isOpen) svg+=`<ellipse cx="${x}" cy="${y}" rx="7" ry="5" transform="rotate(-15,${x},${y})" fill="none" stroke="${col}" stroke-width="1.7"/>`;
  else       svg+=`<ellipse cx="${x}" cy="${y}" rx="7" ry="5" transform="rotate(-15,${x},${y})" fill="${col}"/>`;

  // Hampe (toutes sauf ronde)
  if(durId!=='ronde'){
    if(up){
      svg+=`<line x1="${x+6}" y1="${y-2}" x2="${x+6}" y2="${y-33}" stroke="${col}" stroke-width="1.5"/>`;
      if(durId==='croche') svg+=`<path d="M${x+6},${y-33} C${x+18},${y-25} ${x+18},${y-13} ${x+6},${y-9}" fill="none" stroke="${col}" stroke-width="1.5"/>`;
    } else {
      svg+=`<line x1="${x-6}" y1="${y+2}" x2="${x-6}" y2="${y+33}" stroke="${col}" stroke-width="1.5"/>`;
      if(durId==='croche') svg+=`<path d="M${x-6},${y+33} C${x+6},${y+25} ${x+6},${y+13} ${x-6},${y+9}" fill="none" stroke="${col}" stroke-width="1.5"/>`;
    }
  }
  // Point augmentation
  if(durId==='noire-pt'||durId==='blanche-pt')
    svg+=`<circle cx="${x+11}" cy="${y-4}" r="2.2" fill="${col}"/>`;

  return svg;
}

function buildStaff(results){
  const hint=document.getElementById('staff-hint');
  const lines=document.getElementById('staff-lines');
  const clefEl=document.getElementById('staff-clef');
  const notesEl=document.getElementById('staff-notes');
  const isMelody=melodyDurs.length>0;

  // Largeur : en mélodie on tient compte des durées (figures plus larges)
  const baseW=isMelody?75:58;
  const w=Math.max(600,105+seq.length*baseW+30);
  document.getElementById('staff-svg').setAttribute('viewBox',`0 0 ${w} 120`);
  lines.innerHTML=[30,42,54,66,78].map(y=>`<line x1="8" y1="${y}" x2="${w-10}" y2="${y}" stroke="var(--muted)" stroke-width="1" opacity=".4"/>`).join('')
    +`<line x1="8" y1="30" x2="8" y2="78" stroke="var(--text)" stroke-width="2" opacity=".5"/>`;
  clefEl.innerHTML=`<text x="12" y="92" font-size="80" font-family="serif" fill="var(--text)" opacity=".75">𝄞</text>`;
  if(!seq.length){hint.style.display='block';notesEl.innerHTML='';return;}
  hint.style.display='none';

  const x0=90;
  const sp=Math.min(baseW,(w-x0-20)/Math.max(seq.length,1));
  let svg='';

  seq.forEach((note,i)=>{
    const x=x0+i*sp+sp/2;
    const y=noteY(note,oct);
    const col=results?(results[i]?'var(--success)':'var(--error)'):(COLORS[note]||'var(--text)');
    const hidden=!revealed&&!results;
    const durId=isMelody?(melodyDurs[i]?.durId||'noire'):'noire';

    svg+=`<g class="sn" data-i="${i}">`;
    svg+=noteHeadSVG(x,y,col,durId,hidden);

    if(!hidden){
      svg+=`<text x="${x}" y="112" text-anchor="middle" font-size="${window.innerWidth<=600?12:9}" font-family="DM Mono,monospace" fill="${col}" opacity=".8">${cap(note)}</text>`;

      // Ligature entre notes du même groupe (2 croches, 4 dcr)
      if(isMelody){
        const item=melodyDurs[i];
        if(item&&item.groupSize>1&&item.noteIdx<item.groupSize-1){
          // Relier cette note à la suivante par une ligature
          const xNext=x0+(i+1)*sp+sp/2;
          const stemY=y>=54? y-33 : y+33;
          const stemX=y>=54? x+6 : x-6;
          const stemXNext=y>=54? xNext+6 : xNext-6;
          svg+=`<line x1="${stemX}" y1="${stemY}" x2="${stemXNext}" y2="${stemY}" stroke="${col}" stroke-width="2.5"/>`;
          if(durId==='4dcr')
            svg+=`<line x1="${stemX}" y1="${stemY+6}" x2="${stemXNext}" y2="${stemY+6}" stroke="${col}" stroke-width="2.5"/>`;
        }
      }
    }
    svg+=`</g>`;
  });
  notesEl.innerHTML=svg;
}

function hlNote(idx){
  document.querySelectorAll('.sn').forEach((el,i)=>{
    el.style.filter=i===idx?'url(#note-glow)':'';
  });
}

// ═══ GÉNÉRATION ════════════════════════════
function getActive(){
  return NOTES.filter(n=>{
    const id='n-'+(n==='ré'?'re':n);
    return document.getElementById(id)?.checked;
  });
}

async function generate(){
  await ensureAudio();
  await resumeAudio();
  const active=getActive();
  if(!active.length){alert('Sélectionnez au moins une note.');return;}
  const mode=document.getElementById('mode').value;
  const len=+document.getElementById('length').value;
  if(mode==='melody'){
    const melodyItems=buildMelodySeq(active,len);
    seq=melodyItems.map(m=>m.note);
    melodyDurs=melodyItems; // tableau d'objets {note,durId,noteIdx,groupSize}
  } else {
    seq=Array.from({length:len},()=>active[Math.floor(Math.random()*active.length)]);
    melodyDurs=[];
  }
  ans=[];revealed=false;
  buildStaff(null);
  renderAns(null);
  document.getElementById('result').className='result';
  document.getElementById('btn-play').disabled=false;
  document.getElementById('btn-reveal').disabled=false;
  document.getElementById('btn-ref').disabled=false;
  buildKbd();
  setTimeout(playSeq,300);
}

function loadCustom(){
  const raw=document.getElementById('custom-seq').value.trim().toLowerCase();
  const parts=raw.split(/\s+/);
  const parsed=[];
  for(const p of parts){const n=ALIASES[p];if(n)parsed.push(n);else{alert(`Note invalide: "${p}"`);return;}}
  if(!parsed.length)return;
  seq=parsed;ans=[];revealed=false;
  buildStaff(null);renderAns(null);
  document.getElementById('result').className='result';
  document.getElementById('btn-play').disabled=false;
  document.getElementById('btn-reveal').disabled=false;
  document.getElementById('btn-ref').disabled=false;
  buildKbd();
  // Attendre que le sampler soit prêt avant de jouer
  ensureAudio().then(()=>setTimeout(playSeq,300));
}

// ═══ LECTURE ═══════════════════════════════
function playSeq(){
  if(playing||!seq.length)return;
  resumeAudio(); // relancer si suspendu
  playing=true;
  document.getElementById('play-ind').classList.add('on');
  document.getElementById('btn-play').disabled=true;
  const beat=60/+document.getElementById('tempo').value;
  const ac=Tone.getContext().rawContext;
  const t0=ac.currentTime+0.3;
  const isMelody=melodyDurs.length>0;

  if(isMelody){
    // Mode mélodie : melodyDurs contient {note,durId,noteIdx,groupSize}
    let cursor=0;
    seq.forEach((note,i)=>{
      const item=melodyDurs[i];
      const durId=item.durId||'noire';
      const events=DUR_EVENTS[durId]||[{o:0,dur:0.85}];
      const ev=events[item.noteIdx]||events[0];
      const tNote=t0+(cursor+ev.o)*beat;
      const midi=NOTE_MAP[note]?.[oct];
      if(midi) sampler.triggerAttackRelease(midi, ev.dur*beat, tNote);
      // Highlight à l'instant précis de cette note
      setTimeout(()=>hlNote(i),(tNote-ac.currentTime)*1000);
      // Avancer le curseur seulement à la fin du groupe
      if(item.noteIdx===item.groupSize-1){
        const dur=DURS.find(d=>d.id===durId)||DURS[1];
        cursor+=dur.beats;
      }
    });
    const totalMs=(t0+cursor*beat-ac.currentTime)*1000+300;
    setTimeout(()=>{
      hlNote(-1);
      document.getElementById('play-ind').classList.remove('on');
      document.getElementById('btn-play').disabled=false;
      playing=false;
    },totalMs);
  } else {
    seq.forEach((note,i)=>{
      const tNote=t0+i*beat;
      const midi=NOTE_MAP[note]?.[oct]||'C4';
      sampler.triggerAttackRelease(midi,beat*0.85,tNote);
      setTimeout(()=>hlNote(i),(tNote-ac.currentTime)*1000);
    });
    const totalMs=(t0+seq.length*beat-ac.currentTime)*1000+300;
    setTimeout(()=>{
      hlNote(-1);
      document.getElementById('play-ind').classList.remove('on');
      document.getElementById('btn-play').disabled=false;
      playing=false;
    },totalMs);
  }
}

function playRef(){piano('do',oct,'2n');}

function testAns(){
  if(!ans.length||!ready)return;
  resumeAudio();
  const beat=60/+document.getElementById('tempo').value;
  const ac=Tone.getContext().rawContext;
  const t0=ac.currentTime+0.2;
  const isMelody=melodyDurs.length>0;

  if(isMelody){
    let cursor=0;
    ans.forEach((note,i)=>{
      const item=melodyDurs[i];
      if(!item){const midi=NOTE_MAP[note]?.[oct];if(midi)sampler.triggerAttackRelease(midi,'4n',t0+cursor*beat);cursor+=1;return;}
      const durId=item.durId||'noire';
      const events=DUR_EVENTS[durId]||[{o:0,dur:0.85}];
      const ev=events[item.noteIdx]||events[0];
      const midi=NOTE_MAP[note]?.[oct];
      if(midi) sampler.triggerAttackRelease(midi, ev.dur*beat, t0+(cursor+ev.o)*beat);
      if(item.noteIdx===item.groupSize-1){
        const dur=DURS.find(d=>d.id===durId)||DURS[1];
        cursor+=dur.beats;
      }
    });
  } else {
    // Mode normal : toutes en noires
    ans.forEach((note,i)=>{
      const midi=NOTE_MAP[note]?.[oct];
      if(midi) sampler.triggerAttackRelease(midi, beat*0.85, t0+i*beat);
    });
  }
}

// ═══ RÉPONSE ═══════════════════════════════
function buildKbd(){
  const el=document.getElementById('kbd');el.innerHTML='';
  NOTES.forEach(note=>{
    const b=document.createElement('button');b.className='kb';
    b.textContent=cap(note);b.style.color=COLORS[note];b.style.borderColor=COLORS[note]+'55';
    b.onclick=()=>addNote(note);el.appendChild(b);
  });
}
function addNote(note){
  ans.push(note);renderAns(null);
  piano(note,oct,'4n');
}
function renderAns(results){
  const el=document.getElementById('ans-notes');el.innerHTML='';
  if(!ans.length){el.innerHTML='<span class="hint">Cliquez sur les touches</span>';return;}
  ans.forEach((note,i)=>{
    const s=document.createElement('span');
    s.className='an'+(results?(results[i]?' ok':' ko'):'');
    s.style.color=COLORS[note];s.textContent=cap(note);
    s.onclick=()=>{ans.splice(i,1);renderAns(null);};
    el.appendChild(s);
  });
}
function clearAns(){ans=[];renderAns(null);document.getElementById('result').className='result';}
function undoAns(){ans.pop();renderAns(null);}
function reveal(){revealed=true;buildStaff(null);}

function check(){
  if(!seq.length)return;
  if(ans.length!==seq.length){showResult(false,`${ans.length} note(s) saisie(s), ${seq.length} attendue(s).`);return;}
  const res=seq.map((n,i)=>n===ans[i]);
  const ok=res.every(Boolean);
  renderAns(res);revealed=true;buildStaff(res);
  score.t++;if(ok){score.ok++;score.h.push('ok');}else score.h.push('ko');
  updateScore();
  ok?showResult(true,'✓ Parfait !'):showResult(false,`✗ C'était : ${seq.map(cap).join(' — ')}`);
}
function showResult(ok,msg){const el=document.getElementById('result');el.className='result '+(ok?'ok':'ko');el.textContent=msg;}

// ═══ SCORE ═════════════════════════════════
function updateScore(){
  document.getElementById('sc-t').textContent=score.t;
  document.getElementById('sc-ok').textContent=score.ok;
  document.getElementById('sc-p').textContent=score.t?Math.round(score.ok/score.t*100)+'%':'—';
  const el=document.getElementById('dots');el.innerHTML='';
  score.h.slice(-20).forEach(h=>{
    const d=document.createElement('div');
    d.style.cssText=`width:8px;height:8px;border-radius:50%;background:${h==='ok'?'var(--success)':'var(--error)'}`;
    el.appendChild(d);
  });
}
function resetScore(){score={t:0,ok:0,h:[]};updateScore();}

// ═══ OCT / MODE ════════════════════════════
function setOct(o){
  oct=o;document.querySelectorAll('.ob').forEach(b=>b.classList.toggle('sel',+b.dataset.oct===o));
  if(seq.length&&revealed)buildStaff(null);
}
document.getElementById('mode').onchange=e=>{
  const custom=e.target.value==='custom';
  const melody=e.target.value==='melody';
  document.getElementById('custom-section').style.display=custom?'block':'none';
  document.getElementById('random-options').style.display=custom?'none':'block';
  const btn=document.getElementById('btn-gen');
  btn.textContent=custom?'⟳ Charger':'⟳ Générer';
  btn.onclick=custom?loadCustom:generate;
};

// ═══ CLAVIER ═══════════════════════════════
const KMAP={d:'do',r:'ré',m:'mi',f:'fa',s:'sol',l:'la',b:'si'};
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
  if(e.key===' '){e.preventDefault();playSeq();}
  else if(e.key==='Enter'){e.preventDefault();check();}
  else if(e.key==='Backspace'){e.preventDefault();undoAns();}
  else if(KMAP[e.key.toLowerCase()]&&seq.length)addNote(KMAP[e.key.toLowerCase()]);
});

// ═══ INIT ══════════════════════════════════
buildKbd();updateScore();
document.getElementById('btn-gen').addEventListener('click',ensureAudio,{once:true});

// Relancer l'AudioContext si suspendu — appelé avant chaque lecture
async function resumeAudio(){
  if(!ready||!Tone)return;
  const ac=Tone.getContext().rawContext;
  if(ac.state==='suspended'||ac.state==='interrupted'){
    try{await ac.resume();}catch(e){}
  }
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&ready&&Tone){
    Tone.getContext().rawContext.resume().catch(()=>{});
  }
});
document.addEventListener('click',()=>{
  if(ready&&Tone){Tone.getContext().rawContext.resume().catch(()=>{});}
},{passive:true});

// Keepalive audio — empêche Chrome de suspendre l'AudioContext après inactivité
// Joue un oscillateur silencieux toutes les 25 secondes
setInterval(()=>{
  if(!ready||!Tone)return;
  const ac=Tone.getContext().rawContext;
  if(ac.state==='suspended'){ac.resume().catch(()=>{});return;}
  try{
    const osc=ac.createOscillator();
    const gain=ac.createGain();
    gain.gain.value=0; // silencieux
    osc.connect(gain);gain.connect(ac.destination);
    osc.start();osc.stop(ac.currentTime+0.001);
  }catch(e){}
},25000);

// ── Thème clair/sombre ─────────────────────────────────────────────────
(function(){
  const KEY='solfege_theme';
  function applyTheme(t){
    document.body.classList.toggle('light',t==='light');
    const btn=document.getElementById('theme-btn');
    if(btn)btn.textContent=t==='light'?'🌙':'☀️';
  }
  function toggleTheme(){
    const t=document.body.classList.contains('light')?'dark':'light';
    localStorage.setItem(KEY,t);applyTheme(t);
  }
  document.addEventListener('DOMContentLoaded',()=>{
    const saved=localStorage.getItem(KEY)||'dark';
    applyTheme(saved);
    const btn=document.getElementById('theme-btn');
    if(btn)btn.onclick=toggleTheme;
  });
})();

// ── Sauvegarde/restauration config ────────────────────────────────────
const CFG_KEY = 'solfege_config_notes';
const CFG_DEFAULTS = {"mode": "random", "length": "4", "tempo": "72", "n-do": true, "n-re": true, "n-mi": true, "n-fa": true, "n-sol": true, "n-la": true, "n-si": true};

function saveConfig() {
  const cfg = {};
  const el_mode = document.getElementById('mode'); if(el_mode) cfg['mode'] = el_mode.value;
  const el_length = document.getElementById('length'); if(el_length) cfg['length'] = el_length.value;
  const el_tempo = document.getElementById('tempo'); if(el_tempo) cfg['tempo'] = el_tempo.value;
  const chk_n_do = document.getElementById('n-do'); if(chk_n_do) cfg['n-do'] = chk_n_do.checked;
  const chk_n_re = document.getElementById('n-re'); if(chk_n_re) cfg['n-re'] = chk_n_re.checked;
  const chk_n_mi = document.getElementById('n-mi'); if(chk_n_mi) cfg['n-mi'] = chk_n_mi.checked;
  const chk_n_fa = document.getElementById('n-fa'); if(chk_n_fa) cfg['n-fa'] = chk_n_fa.checked;
  const chk_n_sol = document.getElementById('n-sol'); if(chk_n_sol) cfg['n-sol'] = chk_n_sol.checked;
  const chk_n_la = document.getElementById('n-la'); if(chk_n_la) cfg['n-la'] = chk_n_la.checked;
  const chk_n_si = document.getElementById('n-si'); if(chk_n_si) cfg['n-si'] = chk_n_si.checked;
  
  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch(e) {}
}

function loadConfig() {
  let cfg;
  try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch(e) {}
  cfg = cfg || CFG_DEFAULTS;
  if(cfg['mode'] !== undefined) { const el = document.getElementById('mode'); if(el) el.value = cfg['mode']; }
  if(cfg['length'] !== undefined) { const el = document.getElementById('length'); if(el) el.value = cfg['length']; }
  if(cfg['tempo'] !== undefined) { const el = document.getElementById('tempo'); if(el) el.value = cfg['tempo']; }
  if(cfg['n-do'] !== undefined) { const el = document.getElementById('n-do'); if(el) el.checked = cfg['n-do']; }
  if(cfg['n-re'] !== undefined) { const el = document.getElementById('n-re'); if(el) el.checked = cfg['n-re']; }
  if(cfg['n-mi'] !== undefined) { const el = document.getElementById('n-mi'); if(el) el.checked = cfg['n-mi']; }
  if(cfg['n-fa'] !== undefined) { const el = document.getElementById('n-fa'); if(el) el.checked = cfg['n-fa']; }
  if(cfg['n-sol'] !== undefined) { const el = document.getElementById('n-sol'); if(el) el.checked = cfg['n-sol']; }
  if(cfg['n-la'] !== undefined) { const el = document.getElementById('n-la'); if(el) el.checked = cfg['n-la']; }
  if(cfg['n-si'] !== undefined) { const el = document.getElementById('n-si'); if(el) el.checked = cfg['n-si']; }
  
  const tvEl = document.getElementById('tv') || document.getElementById('tempo-val'); const tmEl = document.getElementById('tempo'); if(tvEl && tmEl) tvEl.textContent = tmEl.value;
  const lvEl = document.getElementById('lv'); const lnEl = document.getElementById('length'); if(lvEl && lnEl) lvEl.textContent = lnEl.value;
  const modeEl = document.getElementById('mode'); if(modeEl) { const ev = new Event('change'); modeEl.dispatchEvent(ev); }
}

function resetConfig() {
  try { localStorage.removeItem(CFG_KEY); } catch(e) {}
  loadConfig();
}

// Auto-save sur tout changement dans la config
document.addEventListener('change', e => {
  const cfg = document.querySelector('.cfg, .cg, #config-panel');
  if (e.target.closest ? e.target.closest('.cfg, .panel, form') : true) saveConfig();
});
document.addEventListener('input', e => {
  if (e.target.type === 'range') saveConfig();
});
